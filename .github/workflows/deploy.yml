name: Deploy

# Auto-deploy the PoC to GitHub Pages on every push to main.
# No post-deploy live gate: the octave-wasm / gnuplot-wasm builds act as the
# gate (a broken build fails here before anything is published). The wasm
# artifacts are Actions-cache-keyed on their recipe inputs, so UI-only pushes
# deploy without rebuilding them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The octave/gnuplot wasm artifacts only change when their recipe inputs
      # change (Dockerfiles + the baked patches). UI-only pushes hit this job
      # too, but restore the last built artifacts from the GH Actions cache and
      # skip the ~2-15 min Docker rebuild entirely.
      - name: Compute wasm input key (content-addressed)
        id: wasm-key
        run: |
          set -euo pipefail
          KEY=$( {
            git hash-object scripts/octave-wasm.Dockerfile scripts/gnuplot-wasm.Dockerfile
            git ls-files patches | sort | while read -r f; do git hash-object "$f"; done
          } | git hash-object --stdin )
          echo "hash=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore wasm artifacts (skip Docker rebuild when inputs unchanged)
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            site/dist/gnuplot-wasm
            site/dist/octave-wasm
          key: oo-wasm-artifacts-${{ steps.wasm-key.outputs.hash }}
          save-always: true

      # gnuplot-wasm (fast: emsdk pull + compile).
      - name: Build gnuplot-wasm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/gnuplot-wasm.Dockerfile
          platforms: linux/amd64
          tags: oo-gnuplot-wasm:latest
          load: true
          cache-from: type=gha,scope=gnuplot
          cache-to: type=gha,mode=max,scope=gnuplot

      # octave-wasm (patched relink FROM the frozen GHCR base, pulled by
      # digest from scripts/octave-wasm.Dockerfile). ~5-15 min on first run,
      # layer-cached afterwards.
      - name: Build octave-wasm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/octave-wasm.Dockerfile
          platforms: linux/amd64
          tags: oo-octave-wasm:latest
          load: true
          cache-from: type=gha,scope=octave
          cache-to: type=gha,mode=max,scope=octave

      - name: Extract gnuplot artifacts
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p site/dist/gnuplot-wasm
          docker create --name gp oo-gnuplot-wasm:latest
          docker cp gp:/src/dist/. site/dist/gnuplot-wasm/
          docker rm gp >/dev/null

      - name: Extract octave artifacts
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p site/dist/octave-wasm
          docker create --name oc oo-octave-wasm:latest
          docker cp oc:/usr/src/octave-wasm/src/web/. site/dist/octave-wasm/
          docker rm oc >/dev/null

      # Bundle the app (esbuild, from app/ ES modules) into site/dist/app/app.js.
      # build:dist also derives dist/app/index.html with ?v=<hash> asset URLs, so
      # first mirror the extracted wasm artifacts into repo dist/ for hashing.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Bundle app
        run: |
          mkdir -p dist
          cp -r site/dist/gnuplot-wasm dist/gnuplot-wasm
          cp -r site/dist/octave-wasm dist/octave-wasm
          npm ci
          npm run build:dist

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r app site/app
          # Serve the generated (cache-busted) page, not the source index.html.
          cp -r dist/app/index.html site/app/index.html
          cp -r dist/app site/dist/app
          touch site/.nojekyll
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./app/">
          <title>octave-server</title>
          <p><a href="./app/">octave-server</a></p>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5