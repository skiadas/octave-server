<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octave Web PoC (Route G)</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; }
    header { padding: 8px 12px; background: #222; color: #fff; font-size: 14px; }
    main { display: flex; flex-direction: row; gap: 8px; padding: 8px; height: calc(100vh - 60px); }

    /* ---- files panel ---- */
    #filesPane { flex: 0 0 240px; display: flex; flex-direction: column; min-width: 0;
                 border: 1px solid #ccc; overflow: auto; }
    .fs-bar { display: flex; align-items: center; gap: 4px; padding: 4px; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
    .fs-bar-btn, .fs-btn { font-size: 11px; cursor: pointer; background: #eee; border: 1px solid #bbb; border-radius: 3px; padding: 2px 6px; }
    .fs-bar-btn:hover, .fs-btn:hover { background: #ddd; }
    .fs-bar-btn:disabled, .fs-btn:disabled { opacity: .4; cursor: default; }
    .fs-ic svg { width: 13px; height: 13px; vertical-align: -2px; fill: none;
                 stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fs-bar-btn .fs-ic svg { width: 13px; height: 13px; }
    .fs-btn:not(.fs-bar-btn) .fs-ic svg { width: 12px; height: 12px; }
    .fs-target { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: #333;
                 border: 1px solid #ddd; border-radius: 3px; padding: 2px 6px; background: #fafafa; }
    .fs-crumb { display: inline-flex; align-items: center; gap: 2px; background: none; border: none;
                font: inherit; color: inherit; cursor: pointer; padding: 0 1px; }
    .fs-crumb:hover { text-decoration: underline; color: #4a90d9; }
    .fs-crumb-sep { color: #999; }
    .fs-up { width: 24px; height: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .fs-body { flex: 1 1 auto; overflow: auto; padding: 4px 0; }
    .fs-row { display: flex; align-items: center; gap: 4px; padding: 2px 6px; white-space: nowrap; }
    .fs-row:hover { background: #f0f2f5; }
    .fs-glyph { width: 14px; text-align: center; cursor: pointer; color: #666; }
    .fs-name { flex: 1; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .fs-dir { font-weight: 600; }
    .fs-actions { display: none; gap: 2px; }
    .fs-row:hover .fs-actions { display: inline-flex; }
    .fs-empty { color: #999; font-size: 12px; padding: 8px; }
    .fs-drop-hint { border: 2px dashed #4a90d9; color: #4a90d9; text-align: center; }
    #filesPane.fs-drop-hint { border-color: #4a90d9; }

    /* ---- editor ---- */
    #editorPane { flex: 1 1 22%; display: flex; flex-direction: column; min-width: 0; }
    #editorBar { display: flex; gap: 4px; padding-bottom: 4px; }
    #filename {
      flex: 1; min-width: 0; font-family: ui-monospace, Menlo, monospace;
      font-size: 12px; padding: 4px 6px; border: 1px solid #888;
    }
    #runBtn { padding: 4px 10px; font-size: 12px; cursor: pointer; }
    #editor {
      flex: 1 1 auto; resize: none; font-family: ui-monospace, Menlo, monospace;
      font-size: 13px; padding: 8px; border: 1px solid #888; white-space: pre; overflow: auto;
    }

    /* ---- console ---- */
    #consolePane { flex: 1 1 36%; display: flex; flex-direction: column; min-width: 0; }
    #output {
      flex: 1 1 auto; overflow: auto; background: #111; color: #ddd;
      font-family: ui-monospace, Menlo, monospace; font-size: 13px;
      padding: 8px; white-space: pre-wrap; word-break: break-word; margin: 0;
    }
    #cmdRow { display: flex; }
    #cmd {
      flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
      padding: 8px; border: 1px solid #888; border-top: 0;
    }
    #status { padding: 4px 8px; font-size: 12px; color: #666; }

    /* ---- plot + gallery column ---- */
    #plotCol { flex: 1 1 32%; display: flex; flex-direction: column; min-width: 0; gap: 6px; }
    #plotBar { display: flex; align-items: center; gap: 6px; }
    #plotPrevBtn, #plotNextBtn {
      width: 26px; height: 26px; line-height: 1; font-size: 13px; cursor: pointer;
      background: #eee; border: 1px solid #bbb; border-radius: 4px; padding: 0;
    }
    #plotPrevBtn:disabled, #plotNextBtn:disabled { opacity: .4; cursor: default; }
    #plotCounter { font-size: 12px; font-weight: 600; color: #444; min-width: 52px; text-align: center; }
    #plotTitle { font-size: 12px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #plotPane { flex: 0 0 auto; border: 1px solid #ccc; overflow: auto; min-height: 120px; max-height: 55%; }
    #plotPane svg { max-width: 100%; height: auto; display: block; margin: 8px; border: 1px solid #eee; }
    #galleryPane { flex: 1 1 auto; border: 1px solid #ccc; overflow: auto; min-height: 80px; }
    .galleryBar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid #ddd; font-size: 12px; font-weight: 600; }
    .galleryBar .spacer { flex: 1; }
    .galleryBar button { font-size: 11px; cursor: pointer; background: #eee; border: 1px solid #bbb; border-radius: 3px; padding: 2px 6px; }
    #galleryList { padding: 4px; }
    #galleryEmpty { color: #999; font-size: 12px; padding: 8px; }
    .gal-run { font-size: 11px; font-weight: 700; color: #4a90d9; padding: 6px 2px 2px; }
    .gal-item { display: inline-block; margin: 4px; border: 1px solid #ccc; vertical-align: top; max-width: 150px; }
    .gal-item:hover { border-color: #4a90d9; }
    .gal-item.gal-active { border-color: #4a90d9; box-shadow: 0 0 0 2px rgba(74,144,217,.35); }
    .gal-thumb { width: 148px; height: 90px; overflow: hidden; cursor: pointer; background: #fff; }
    .gal-thumb svg { max-width: 100%; height: auto; }
    .gal-meta { font-size: 10px; color: #555; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gal-tools { padding: 2px 4px; }
    .gal-btn { font-size: 10px; cursor: pointer; background: #f2f2f2; border: 1px solid #bbb; border-radius: 3px; padding: 1px 5px; margin-right: 3px; }

    /* ---- preview overlay ---- */
    #previewPane { display: none; position: fixed; right: 8px; top: 52px; bottom: 8px; width: 40%;
                   background: #fff; border: 1px solid #999; box-shadow: 0 4px 12px rgba(0,0,0,.3);
                   z-index: 20; flex-direction: column; }
    #previewTitle { font-size: 12px; font-weight: 600; padding: 6px 10px; border-bottom: 1px solid #ddd; }
    #previewClose { position: absolute; right: 4px; top: 2px; cursor: pointer; background: none; border: none; font-size: 16px; color: #666; }
    #previewImg { display: none; max-width: 100%; max-height: calc(100% - 40px); object-fit: contain; margin: 8px; }
    #previewText { display: none; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace;
                   font-size: 12px; padding: 8px; overflow: auto; flex: 1; }

    .err { color: #f88; }

    /* ---- polish: focus + consistency ---- */
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid #4a90d9; outline-offset: 1px;
    }
    #status:empty { display: none; }
    #status { color: #666; }
    #output::-webkit-scrollbar, #galleryPane::-webkit-scrollbar, #filesPane::-webkit-scrollbar { width: 9px; }
    #output::-webkit-scrollbar-thumb, #galleryPane::-webkit-scrollbar-thumb, #filesPane::-webkit-scrollbar-thumb {
      background: #c4c9d0; border-radius: 4px; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="ic-root" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="ic-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="ic-folder-plus" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></symbol>
    <symbol id="ic-file" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></symbol>
    <symbol id="ic-file-plus" viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="12" y1="13" x2="12" y2="19"/><line x1="9" y1="16" x2="15" y2="16"/></symbol>
    <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="ic-pencil" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
    <symbol id="ic-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="ic-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
    <symbol id="ic-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
  </svg>
  <header>Octave Web PoC &mdash; Route G (octave-wasm + gnuplot-wasm)</header>
  <main>
    <div id="filesPane" title="Drop files here to upload"></div>

    <div id="editorPane">
      <div id="editorBar">
        <input id="filename" type="text" value="script.m" autocomplete="off" spellcheck="false">
        <button id="runBtn" type="button">Run (Ctrl+Enter)</button>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="% Write a full Octave script, then press Ctrl+Enter to run it."></textarea>
    </div>

    <div id="consolePane">
      <pre id="output">Loading…
</pre>
      <div id="cmdRow"><input id="cmd" type="text" placeholder="octave&gt; plot(sin(0:0.1:10))" autocomplete="off" spellcheck="false"></div>
      <div id="status"></div>
    </div>

    <div id="plotCol">
      <div id="plotBar">
        <button id="plotPrevBtn" type="button" title="Previous (←)" disabled>◀</button>
        <span id="plotCounter">0 / 0</span>
        <button id="plotNextBtn" type="button" title="Next (→)" disabled>▶</button>
        <span id="plotTitle"></span>
      </div>
      <div id="plotPane"></div>
      <div id="galleryPane">
        <div class="galleryBar">
          <span>Figure history</span>
          <span class="spacer"></span>
          <button id="galleryClearBtn" type="button">clear</button>
        </div>
        <div id="galleryList"><div id="galleryEmpty">No figures yet. Run a plotting command.</div></div>
      </div>
    </div>
  </main>

  <input id="fileInput" type="file" multiple hidden>

  <div id="previewPane">
    <div id="previewTitle">Preview</div>
    <button id="previewClose" type="button" title="Close">×</button>
    <img id="previewImg" alt="">
    <pre id="previewText"></pre>
  </div>

  <script src="../dist/gnuplot-wasm/gnuplot.js"></script>
  <script src="../dist/octave-wasm/octave.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
  <script src="../dist/app/app.js"></script>
</body>
</html>
