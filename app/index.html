<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octave Web PoC (Route G)</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; }
    header { padding: 8px 12px; background: #222; color: #fff; font-size: 14px; }
    main { display: flex; flex-direction: row; gap: 8px; padding: 8px; height: calc(100vh - 60px); }
    #consolePane { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; }
    #plotPane { flex: 1 1 50%; border: 1px solid #ccc; overflow: auto; min-width: 0; }
    #plotPane svg { max-width: 100%; height: auto; display: block; margin: 8px; border: 1px solid #eee; }
    #output {
      flex: 1 1 auto; overflow: auto; background: #111; color: #ddd;
      font-family: ui-monospace, Menlo, monospace; font-size: 13px;
      padding: 8px; white-space: pre-wrap; word-break: break-word; margin: 0;
    }
    #cmdRow { display: flex; }
    #cmd {
      flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
      padding: 8px; border: 1px solid #888; border-top: 0;
    }
    #status { padding: 4px 8px; font-size: 12px; color: #666; }
    .err { color: #f88; }
  </style>
</head>
<body>
  <header>Octave Web PoC &mdash; Route G (octave-wasm + gnuplot-wasm)</header>
  <main>
    <div id="consolePane">
      <pre id="output">Loading…</pre>
      <div id="cmdRow"><input id="cmd" type="text" placeholder="octave&gt; plot(sin(0:0.1:10))" autocomplete="off" spellcheck="false"></div>
      <div id="status"></div>
    </div>
    <div id="plotPane"></div>
  </main>
  <script src="../dist/gnuplot-wasm/gnuplot.js"></script>
  <script src="../dist/octave-wasm/octave.js"></script>
  <script src="main.js"></script>
</body>
</html>
